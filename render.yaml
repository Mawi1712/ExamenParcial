services:
  - type: web
    name: portal-academico
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:${PORT}
      - key: ConnectionStrings__DefaultConnection
        value: DataSource=/data/app.db;Cache=Shared
      - key: Redis__Configuration
        sync: false
      - key: Redis__InstanceName
        value: PortalAcademico:
    disk:
      name: portal-data
      mountPath: /data
      sizeGB: 1
